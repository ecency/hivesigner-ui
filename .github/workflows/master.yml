name: Master CI/CD
# Pushing to main deploys hivesigner.com. Production releases are the manual
# development -> main merge, so this only ever runs when that merge happens.
on:
  push:
    branches:
      - main
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:ci
      # build first: it generates src/routeTree.gen.ts (gitignored), which the
      # typecheck needs, and it runs the node-globals guard.
      - run: pnpm build
        env:
          GIT_SHA: ${{ github.sha }}
      - run: pnpm typecheck
      - run: pnpm test

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./Dockerfile
          push: true
          tags: ecency/hivesigner:latest
          build-args: |
            GIT_SHA=${{ github.sha }}
            SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            API_URL=${{ vars.API_URL }}

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

  deploy-production:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: SSH and deploy node app
      uses: appleboy/ssh-action@5711a203b3207eb1c6cebec6ac2152ab210ec3ae
      env:
        PRODUCTION_PORT: ${{secrets.PRODUCTION_PORT}}
        BROADCAST_NETWORK: ${{secrets.BROADCAST_NETWORK}}
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.SSH_PORT }}
        envs: PRODUCTION_PORT,BROADCAST_NETWORK
        script: |
          cd ~/hivesigner-ui
          git pull origin main
          git checkout main
          docker system prune -a -f
          export PORT=$PRODUCTION_PORT
          export BROADCAST_NETWORK=$BROADCAST_NETWORK
          docker pull ecency/hivesigner:latest
          docker stack deploy -c docker-compose.yml -c docker-compose.production.yml hivesigner-production
          # `stack deploy` returns once the update is ACCEPTED, so without a wait
          # the workflow reports success over tasks that never start. Wait for
          # every replica to be Running on the image THIS deploy asked for: the
          # spec's image carries the digest swarm resolved, and under start-first
          # the outgoing tasks still run the previous one, so they cannot
          # satisfy the count. The nginx image has no HEALTHCHECK, so Running is
          # the strongest signal available here.
          SERVICE=hivesigner-production_app
          want=$(docker service inspect "$SERVICE" --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}')
          replicas=$(docker service inspect "$SERVICE" --format '{{.Spec.Mode.Replicated.Replicas}}')
          for i in $(seq 1 40); do
            state=$(docker service inspect "$SERVICE" --format '{{if .UpdateStatus}}{{.UpdateStatus.State}}{{else}}none{{end}}' 2>/dev/null || echo unknown)
            case "$state" in
              rollback_started|rollback_completed|rollback_paused|paused)
                echo "update did not take: $state"
                docker service ps "$SERVICE" --no-trunc | head -8
                exit 1 ;;
            esac
            running=$(docker service ps "$SERVICE" --no-trunc --filter desired-state=running \
              --format '{{.CurrentState}} {{.Image}}' 2>/dev/null \
              | awk -v want="$want" '$1 == "Running" && index($0, want)' | wc -l)
            if [ "$running" -ge "$replicas" ]; then
              echo "deploy ok: $running/$replicas replicas running $want (update state: $state)"
              exit 0
            fi
            sleep 5
          done
          echo "service did not reach $replicas running replicas on $want in time:"
          docker service ps "$SERVICE" --no-trunc | head -8
          exit 1
