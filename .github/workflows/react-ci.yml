name: React app CI

# Lint, test and build the React rewrite in app/. Runs only when app/ changes,
# so it does not interfere with the Nuxt Staging/Master workflows (which deploy
# on push to development/main). The React app has no deploy step until cutover.
on:
  push:
    branches:
      - feature/react-rewrite
    paths:
      - 'app/**'
  pull_request:
    paths:
      - 'app/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:ci
      - run: pnpm test
      - run: pnpm build
        env:
          GIT_SHA: ${{ github.sha }}
