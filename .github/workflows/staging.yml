name: Staging CI/CD
# Pushing to development deploys staging.hivesigner.com.
#
# The testnet deploy is gone: nobody develops against a Hive testnet, and the
# bundle baked BROADCAST_NETWORK at build time so testnet.hivesigner.com was
# serving mainnet behaviour regardless. Its swarm stack has to be removed on the
# host by hand; CI no longer touches it.
on:
  push:
    branches:
      - development
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:ci
      # build first: it generates src/routeTree.gen.ts (gitignored), which the
      # typecheck needs, and it runs the node-globals guard.
      - run: pnpm build
        env:
          GIT_SHA: ${{ github.sha }}
      - run: pnpm typecheck
      - run: pnpm test

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./Dockerfile
          push: true
          tags: ecency/hivesigner:development
          build-args: |
            GIT_SHA=${{ github.sha }}
            SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            API_URL=${{ vars.API_URL }}

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: SSH and deploy node app
      uses: appleboy/ssh-action@5711a203b3207eb1c6cebec6ac2152ab210ec3ae
      env:
        STAGING_PORT: ${{secrets.STAGING_PORT}}
        BROADCAST_NETWORK: ${{secrets.BROADCAST_NETWORK}}
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.SSH_PORT }}
        envs: STAGING_PORT,BROADCAST_NETWORK
        script: |
          cd ~/hivesigner-ui
          git pull origin development
          git checkout development
          export PORT=$STAGING_PORT
          export BROADCAST_NETWORK=$BROADCAST_NETWORK
          docker pull ecency/hivesigner:development
          docker stack deploy -c docker-compose.yml -c docker-compose.staging.yml hivesigner-staging
