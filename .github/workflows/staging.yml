name: Staging CI/CD
# Pushing to development deploys staging.hivesigner.com.
#
# The testnet deploy is gone: nobody develops against a Hive testnet, and the
# bundle baked BROADCAST_NETWORK at build time so testnet.hivesigner.com was
# serving mainnet behaviour regardless. Its swarm stack has to be removed on the
# host by hand; CI no longer touches it.
on:
  push:
    branches:
      - development
# One release at a time. Each build carries the assets of the image it
# replaces, so a build must start after the previous one has been pushed. A
# running release is never cancelled; a newer push only replaces one that is
# still waiting, which was never deployed, so no page refers to its assets.
concurrency:
  group: deploy-staging
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:ci
      # build first: it generates src/routeTree.gen.ts (gitignored), which the
      # typecheck needs, and it runs the node-globals guard.
      - run: pnpm build
        env:
          GIT_SHA: ${{ github.sha }}
      - run: pnpm typecheck
      - run: pnpm test

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./Dockerfile
          push: true
          # Always resolve PREVIOUS_IMAGE from the registry, never a stale local copy.
          pull: true
          tags: ecency/hivesigner:development
          # The image being replaced, whose assets the new one carries forward.
          build-args: |
            PREVIOUS_IMAGE=ecency/hivesigner:development
            GIT_SHA=${{ github.sha }}
            SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            API_URL=${{ vars.API_URL }}
            SITE_URL=https://staging.hivesigner.com

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: SSH and deploy node app
      uses: appleboy/ssh-action@5711a203b3207eb1c6cebec6ac2152ab210ec3ae
      env:
        STAGING_PORT: ${{secrets.STAGING_PORT}}
        BROADCAST_NETWORK: ${{secrets.BROADCAST_NETWORK}}
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.SSH_PORT }}
        envs: STAGING_PORT,BROADCAST_NETWORK
        script: |
          # Stop at the first failure. Without this a failed pull or deploy was
          # followed by the gate inspecting the PREVIOUS release's spec, whose
          # replicas were all Running, and the job reported success.
          set -e
          cd ~/hivesigner-ui
          git pull origin development
          git checkout development
          export PORT=$STAGING_PORT
          export BROADCAST_NETWORK=$BROADCAST_NETWORK
          docker pull ecency/hivesigner:development
          docker stack deploy -c docker-compose.yml -c docker-compose.staging.yml hivesigner-staging || { echo 'stack deploy failed'; exit 1; }
          # `stack deploy` returns once the update is ACCEPTED, so without a wait
          # the workflow reports success over tasks that never start. Wait for
          # every replica to be Running on the image THIS deploy asked for: the
          # spec's image carries the digest swarm resolved, and under start-first
          # the outgoing tasks still run the previous one, so they cannot
          # satisfy the count. The image defines a HEALTHCHECK (Dockerfile), and
          # swarm reports a task Running only once it has passed; the container
          # health is read as well, per task, because that ordering is engine
          # behaviour rather than a documented guarantee.
          SERVICE=hivesigner-staging_app
          want=$(docker service inspect "$SERVICE" --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}')
          replicas=$(docker service inspect "$SERVICE" --format '{{.Spec.Mode.Replicated.Replicas}}')
          for i in $(seq 1 40); do
            state=$(docker service inspect "$SERVICE" --format '{{if .UpdateStatus}}{{.UpdateStatus.State}}{{else}}none{{end}}' 2>/dev/null || echo unknown)
            case "$state" in
              rollback_started|rollback_completed|rollback_paused|paused)
                echo "update did not take: $state"
                docker service ps "$SERVICE" --no-trunc | head -8
                exit 1 ;;
            esac
            # Task ids of replicas Running on the wanted image.
            ids=$(docker service ps "$SERVICE" --no-trunc --filter desired-state=running \
              --format '{{.ID}} {{.CurrentState}} {{.Image}}' 2>/dev/null \
              | awk -v want="$want" '$2 == "Running" && index($0, want) { print $1 }')
            running=$(printf '%s\n' $ids | grep -c . || true)
            if [ "$running" -ge "$replicas" ]; then
              # Every one of those containers must report healthy (or carry no
              # healthcheck). A container not on this node cannot be read and
              # is accepted on the strength of Running.
              unhealthy=0
              for id in $ids; do
                cid=$(docker ps -q --filter "label=com.docker.swarm.task.id=$id" 2>/dev/null | head -1)
                [ -n "$cid" ] || continue
                status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$cid" 2>/dev/null || echo unknown)
                case "$status" in healthy|none) ;; *) unhealthy=$((unhealthy + 1)) ;; esac
              done
              if [ "$unhealthy" -eq 0 ]; then
                echo "deploy ok: $running/$replicas replicas running and healthy on $want (update state: $state)"
                exit 0
              fi
              echo "waiting: $unhealthy container(s) not healthy yet"
            fi
            sleep 5
          done
          echo "service did not reach $replicas running replicas on $want in time:"
          docker service ps "$SERVICE" --no-trunc | head -8
          exit 1

  # The contract suite (e2e/), against the staging that was just deployed. The
  # same specs already ran on the pull request against the built image; this
  # run proves the DEPLOYED build honours the published URLs, headers and flows.
  # It fails the workflow after the deploy, which has already happened, so a
  # regression is visible on the run rather than found by an app author.
  contract:
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium webkit
        working-directory: e2e
      - run: npx playwright test --reporter=line
        working-directory: e2e
        env:
          BASE_URL: https://staging.hivesigner.com
          CI: true
