name: UI CI

# Lint, test and build on PULL REQUESTS only. Pushes to development are gated by
# the identical job in Staging CI/CD before it deploys, and pushes to main by the
# one in Master CI/CD, so a push trigger here would just duplicate them.
on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:ci
      # build first: it generates src/routeTree.gen.ts (gitignored), which the
      # typecheck needs for the route registry. It also runs the node-globals guard.
      - run: pnpm build
        env:
          GIT_SHA: ${{ github.sha }}
      - run: pnpm typecheck
      - run: pnpm test

  # The contract suite (e2e/) against the image this pull request would ship.
  # The specs pin what third-party apps and existing users depend on (published
  # URLs, security headers, sign and consent flows), so a break is caught here,
  # before merge, rather than after the staging deploy. The image is the right
  # target: the headers and the SPA fallback come from nginx.conf, which a
  # plain static server would not reproduce. No Sentry DSN is passed, so the
  # run reports nothing.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hivesigner-ui:pr --build-arg GIT_SHA=${{ github.sha }} .
      - run: docker run -d --name ui -p 3000:3000 -e PORT=3000 hivesigner-ui:pr
      - name: Wait for the container to answer
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/ >/dev/null && exit 0
            sleep 2
          done
          docker logs ui
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test --reporter=line
        working-directory: e2e
        env:
          BASE_URL: http://127.0.0.1:3000
          CI: true
