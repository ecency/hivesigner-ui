# Serving config for the built React SPA (dist/). Mirrors the Nuxt static
# switch (repo root, PR #107): static files from nginx, SPA fallback, the same
# security headers, and a 16 KiB request line for long /sign links.
#
# CSP: the enforced policy denies framing and pins the sources this browser-only
# app actually uses; a WIDER report-only policy runs alongside it during rollout
# so any missed source shows up as a report before it is enforced (#101). At
# cutover the Dockerfile builds app/ and serves this file.

server {
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;

  server_tokens off;
  absolute_redirect off;

  # /sign links carry the whole transaction in the URL.
  large_client_header_buffers 4 16k;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Enforced: no framing, scripts/styles from self only, chain calls to Hive RPC
  # nodes, images to the Ecency image proxy. Tighten as the app's real needs settle.
  add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://images.ecency.com data:; connect-src 'self' https://api.hive.blog https://api.deathwing.me; form-action 'self'" always;
  # Report-only rollout policy (wider): catches anything the enforced policy would
  # break before it is promoted. Point report-uri at a collector when one exists.
  add_header Content-Security-Policy-Report-Only "default-src 'self'; connect-src 'self' https:; img-src 'self' https: data:; script-src 'self'" always;

  location /static/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    expires epoch;
    try_files $uri $uri/index.html /index.html;
  }
}
