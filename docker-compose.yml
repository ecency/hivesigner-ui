version: '3.7'

services:
  app:
    image: ecency/hivesigner:development
    environment:
      - BROADCAST_NETWORK
      - PORT
    ports:
      - ${PORT}:${PORT}
    deploy:
      replicas: 4
      resources:
        limits:
          cpus: "0.9"
          memory: 2048M
      update_config:
        parallelism: 2
        order: start-first
        failure_action: rollback
        delay: 10s
      rollback_config:
        parallelism: 0
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
        # NO max_attempts. A cap lets swarm give up on a task after a burst of
        # crashes and leave the service short until the next deploy. Four
        # replicas soften that, one (staging) does not; uncapped is the right
        # trade for a static nginx that only fails on a bad image, which the
        # rollback below already handles.
        window: 60s
