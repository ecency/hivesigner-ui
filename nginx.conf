# Serving config for the built SPA (dist/): static files from nginx, the SPA
# fallback, the security headers, and a 16 KiB request line for long /sign
# links that carry a whole transaction. The Dockerfile copies this file into
# the image; the contract suite (e2e/) checks the headers it sets.
#
# CSP: the enforced policy denies framing and pins the sources this browser-only
# app actually uses.

# The docs moved here from GitBook. docs.hivesigner.com forwards every request
# to /docs/h plus its old path; each old page lands on the page that replaced
# it, anything else on the docs home.
map $uri $gitbook_page {
  default /docs;
  ~^/docs/h/guides/get-started/login-with-hivesigner(\.md)?/?$ /docs/how-it-works;
  ~^/docs/h/guides/get-started/integrate-hivesigner(\.md)?/?$ /docs/register-app;
  ~^/docs/h/guides/get-started/hivesigner-oauth2(\.md)?/?$ /docs/oauth2;
  ~^/docs/h/sdk/(javascript|python)(\.md)?/?$ /docs/sdk;
  ~^/docs/h/api/(untitled|hive-api)(\.md)?/?$ /docs/api;
  ~^/docs/h/use-cases/untitled(\.md)?/?$ /docs/image-uploads;
  ~^/docs/h/use-cases/backend-security(\.md)?/?$ /docs/tokens;
  ~^/docs/h/use-cases/login-without-authority(\.md)?/?$ /docs/login-only;
  ~^/docs/h/faq/questions(\.md)?/?$ /docs/faq;
}

server {
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;

  server_tokens off;
  absolute_redirect off;
  # The docs' llms.txt and Markdown copies carry every language.
  charset utf-8;

  # /sign links carry the whole transaction in the URL.
  large_client_header_buffers 4 16k;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

  add_header X-Frame-Options "DENY" always;
  # Staging and testnet are copies of the site; search engines must not index
  # them or link unfurlers pick them over production. nginx skips an add_header
  # whose value is empty, so production sends nothing here.
  set $robots "";
  if ($host ~* ^(staging|testnet)\.) {
    set $robots "noindex, nofollow";
  }
  add_header X-Robots-Tag $robots always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Enforced. Scripts only from self, so an injected script cannot run or
  # exfiltrate. connect-src is 'self' https: on purpose: the SDK fails over
  # across a pool of public Hive RPC nodes, so pinning individual hosts would
  # break the failover this app relies on; the app only ever POSTs JSON-RPC.
  # Framing is denied; images from the Ecency proxy.
  add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://i.ecency.com data:; connect-src 'self' https:; form-action 'self'" always;

  location /static/ {
    # An add_header in a location REPLACES the server's whole set for that
    # location, so the security headers are repeated here or assets ship
    # without them. One Cache-Control, not `expires` plus a second header.
    #
    # Deliberately without `always`: nginx then adds it to found files only
    # (2xx and 304, and a 416 for a range past the end of a found file, which
    # nothing caches). With `always` a 404 carried the year-long immutable
    # header too, and a miss that a browser or CDN saw once, for instance
    # while a release rolls out container by container, stayed a miss.
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri @static_missing;
  }

  # A missing hashed asset: a plain 404 that nothing may keep, so the next
  # request asks again and finds the file once it exists.
  location @static_missing {
    add_header Cache-Control "no-store" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    return 404;
  }

  # The developer page became the docs.
  location ~ ^/developers/?$ {
    return 301 /docs;
  }

  location = /docs/h {
    return 301 /docs;
  }

  location ^~ /docs/h/ {
    return 301 $gitbook_page;
  }

  # Each docs page as Markdown, for tools that read docs (see /docs/llms.txt).
  # An add_header here replaces the server's set, so the security headers are
  # repeated, as in /static/.
  location ~ ^/docs/.+\.md$ {
    types {}
    default_type "text/markdown; charset=utf-8";
    expires epoch;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex" always;
    try_files $uri =404;
  }

  location / {
    expires epoch;
    # /apps, /about, /signs and every docs page resolve to their own HTML,
    # written at build time with their own canonical and share metadata.
    # Everything else gets app.html: the same app, no canonical, a noindex
    # hint.
    try_files $uri $uri/index.html /app.html;
  }
}
